openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gemini
    description: Kazakh tradition comic generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gemini/comic:
    post:
      operationId: generateTraditionComic
      tags: [gemini]
      summary: Generate a Kazakh comic explanation of a tradition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraditionComicInput"
      responses:
        "200":
          description: Generated comic script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraditionComic"
        "400":
          description: Invalid tradition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
        "502":
          description: The AI service could not generate a comic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TraditionComicInput:
      type: object
      properties:
        tradition:
          type: string
          minLength: 2
          maxLength: 160
      required:
        - tradition
    TraditionComic:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    GeminiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

