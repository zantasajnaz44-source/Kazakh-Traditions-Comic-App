openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gemini
    description: Kazakh tradition comic generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gemini/comic:
    post:
      operationId: generateTraditionComic
      tags: [gemini]
      summary: Generate a Kazakh comic explanation of a tradition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraditionComicInput"
      responses:
        "200":
          description: Illustrated three-panel comic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraditionComic"
        "400":
          description: Invalid tradition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
        "502":
          description: The AI service could not generate a comic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
  /gemini/answer:
    post:
      operationId: answerTraditionQuestion
      tags: [gemini]
      summary: Answer a child's question about a tradition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraditionQuestionInput"
      responses:
        "200":
          description: AI explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraditionQuestionAnswer"
        "400":
          description: Invalid question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
        "502":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TraditionComicInput:
      type: object
      properties:
        tradition:
          type: string
          minLength: 2
          maxLength: 160
      required:
        - tradition
    TraditionComic:
      type: object
      properties:
        title:
          type: string
        elderRole:
          type: string
          enum: ["Әже", "Ата", "Ана", "Әке", "Тәте", "Жезде"]
        childName:
          type: string
        panels:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/TraditionComicPanel"
        meaning:
          type: string
        closingQuestion:
          type: string
        comicImageData:
          type: string
          description: Base64-encoded illustrated three-panel comic image
        comicImageMimeType:
          type: string
          description: MIME type of the generated comic image
      required:
        - title
        - elderRole
        - childName
        - panels
        - meaning
        - closingQuestion
        - comicImageData
        - comicImageMimeType
    TraditionQuestionInput:
      type: object
      properties:
        question:
          type: string
          minLength: 2
          maxLength: 5000
        tradition:
          type: string
          maxLength: 160
        comicMeaning:
          type: string
          maxLength: 2000
      required: [question]
    TraditionQuestionAnswer:
      type: object
      properties:
        answer:
          type: string
          minLength: 1
      required: [answer]
    TraditionComicPanel:
      type: object
      properties:
        scene:
          type: string
        girlLine:
          type: string
        elderLine:
          type: string
      required:
        - scene
        - girlLine
        - elderLine
    GeminiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

